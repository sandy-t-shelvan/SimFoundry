name: sceneagent-ci

on:
  push:
  pull_request:

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned ruff
        run: python -m pip install -r requirements-sceneagent-ci.txt
      - name: Ruff
        run: python -m ruff check sceneagent
      - name: Ruff format
        run: python -m ruff format --check sceneagent

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned mypy and typed CPU libraries
        run: python -m pip install -r requirements-sceneagent-ci.txt
      - name: Mypy
        run: python -m mypy sceneagent

  pytest-unit:
    name: pytest unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m compileall -q sceneagent
      - name: Install pinned CPU test dependencies
        run: python -m pip install -r requirements-sceneagent-ci.txt
      - name: Pytest unit
        # GPU tests are marked `gpu` and left out of this run. A skip inside
        # the job is not how a GPU test stays off the CPU gate.
        run: python -m pytest tests/sceneagent -q -m "not gpu" --strict-markers

  pytest-cpu:
    name: pytest cpu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU test dependencies
        run: python -m pip install -r requirements-cpu-ci.txt -r requirements-sceneagent-ci.txt
      - name: Pytest CPU outside tests/sceneagent
        # `-m "not gpu and not network"`. ci/cpu-test-skips.txt lists every
        # deselected test and omitted file. A skip inside the job fails the run.
        run: python scripts/ci/run_cpu_tests.py

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned actionlint 1.7.12
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          : "${ACTIONLINT_VERSION:?}"
          : "${ACTIONLINT_SHA256:?}"
          curl -sSLf -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          actionlint -version
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: actionlint
        run: actionlint -color
