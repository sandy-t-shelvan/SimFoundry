# Throwaway (not for main): print the PUBLIC half of VAST_SSH_PRIVATE_KEY so it
# can be authorized on instance 58301075. The private key is written mode 0600
# to a temp file, never echoed, and removed. Only ssh-keygen -y output is shown.
name: hostkey-scan
on:
  push:
    branches: [claude/hostkey-scan]
permissions:
  contents: read
jobs:
  ci-public-key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Derive the CI key's public half and fingerprint
        env:
          VAST_SSH_PRIVATE_KEY: ${{ secrets.VAST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$VAST_SSH_PRIVATE_KEY" > "$key"
          ssh-keygen -y -f "$key" > ci_key.pub
          cat ci_key.pub
          ssh-keygen -lf ci_key.pub
