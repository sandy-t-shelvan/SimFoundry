# GPU smoke for SceneAgent on Fruits.mp4.
# The instance id is the literal 59601312. No input, label, or request file
# can change it. The job never creates, rents, resizes, destroys, starts,
# or stops an instance. A stopped instance is refused. Starting or stopping
# it takes two separate user yeses outside this workflow.
#
# pull_request_target loads this file from the repository default branch
# (main). A label on a pull request that targets Main_duplicate does not run
# until main contains this file. The request-file push is a plain push, so it
# uses the workflow committed on Main_duplicate. Once this file is on
# Main_duplicate, that push starts a workflow run with no workflow_dispatch
# and no click from Sandeep. workflow_dispatch does not start or stop the
# instance either. No trigger sends a state PUT.
name: sceneagent-gpu-smoke

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: GPU pipeline to run
        type: choice
        options: [run4, bin, splat, masks, association, sam3d, place, probe]
        default: run4
  pull_request_target:
    types: [labeled]
  push:
    branches:
      - Main_duplicate
    paths:
      - ci/gpu-run-request.json

permissions:
  contents: read

# Concurrency is on the smoke job, not the workflow. pull_request_target
# labeled starts a run for every label. A workflow-level group would let an
# unrelated label cancel a pending smoke even with cancel-in-progress false.
jobs:
  request_file_guard:
    name: request-file guard
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - name: Checkout the pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refuse a push that changes anything but the request file
        id: decide
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          : "${BEFORE:?}"
          : "${AFTER:?}"
          : "${GITHUB_OUTPUT:?}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "gpu-smoke request-file refused: push has no before SHA"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout --detach "$BEFORE"
          echo "gpu-smoke diff checker at $(git rev-parse HEAD)"
          python -m sceneagent.gpu_smoke_trigger check-push-diff

  fruits_gpu_smoke:
    name: fruits-gpu-smoke
    needs: request_file_guard
    # A same-repo run-gpu-smoke label from an allowlisted actor is enough.
    if: >-
      always() &&
      !cancelled() &&
      (needs.request_file_guard.result == 'success' || needs.request_file_guard.result == 'skipped') &&
      (github.event_name != 'push' || needs.request_file_guard.outputs.proceed == 'true') &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'run-gpu-smoke' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.event.pull_request.base.ref == 'Main_duplicate' || github.event.pull_request.base.ref == 'main') &&
          (github.actor == 'sandy-t-shelvan' || github.actor == 'cursor[bot]')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: gpu-smoke-59601312
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Log gpu-smoke actor
        env:
          GPU_SMOKE_ACTOR: ${{ github.actor }}
        run: |
          : "${GPU_SMOKE_ACTOR:?}"
          echo "gpu-smoke actor=${GPU_SMOKE_ACTOR}"

      - name: Checkout base orchestrator
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: orchestrator
          persist-credentials: false

      - name: Checkout PR head payload
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: payload
          persist-credentials: false

      - name: Checkout orchestrator for dispatch or request-file
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: orchestrator
          persist-credentials: false

      - name: Checkout payload for dispatch or request-file
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: payload
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record checked-out payload commit
        working-directory: payload
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          printf '%s\n' "$sha" | grep -Eq '^[0-9a-f]{40}$'
          echo "CHECKED_OUT_SHA=$sha" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/sf4-artifacts"
          printf '%s\n' "$sha" > "$GITHUB_WORKSPACE/sf4-artifacts/checked_out_commit.txt"

      - name: Vast GPU smoke on Fruits.mp4
        working-directory: orchestrator
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          VAST_SSH_PRIVATE_KEY: ${{ secrets.VAST_SSH_PRIVATE_KEY }}
          SMOKE_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && 'dispatch' || github.event_name == 'pull_request_target' && 'label' || github.event_name == 'push' && 'request-file' || 'invalid' }}
          # Only a manual run chooses; labels and request files stay run4.
          SMOKE_PIPELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.pipeline || 'run4' }}
          SMOKE_ACTOR: ${{ github.actor }}
          CHECKED_OUT_SHA: ${{ env.CHECKED_OUT_SHA }}
        run: |
          set -euo pipefail
          : "${SMOKE_TRIGGER:?}"
          : "${SMOKE_PIPELINE:?}"
          : "${SMOKE_ACTOR:?}"
          : "${CHECKED_OUT_SHA:?}"
          measured=$(cat "$GITHUB_WORKSPACE/sf4-artifacts/checked_out_commit.txt")
          if [ "$measured" != "$CHECKED_OUT_SHA" ]; then
            echo "checked-out commit evidence does not match git rev-parse" >&2
            exit 1
          fi
          python -m sceneagent.vast_smoke --instance-id 59601312 --checkout "$GITHUB_WORKSPACE/payload" --artifacts "$GITHUB_WORKSPACE/sf4-artifacts" --trigger "$SMOKE_TRIGGER" --actor "$SMOKE_ACTOR" --commit-sha "$CHECKED_OUT_SHA" --pipeline "$SMOKE_PIPELINE"

      - name: Upload plan, ledger, and manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sceneagent-fruits-smoke
          retention-days: 14
          if-no-files-found: error
          path: |
            sf4-artifacts/plan.json
            sf4-artifacts/ledger.json
            sf4-artifacts/manifest.json
            sf4-artifacts/run4_evidence.json
            sf4-artifacts/bin_evidence.json
            sf4-artifacts/splat_evidence.json
            sf4-artifacts/ns_eval.json
            sf4-artifacts/masks_evidence.json
            sf4-artifacts/association_evidence.json
            sf4-artifacts/sam3d_evidence.json
            sf4-artifacts/bin_score.json
            sf4-artifacts/inventory.txt
            sf4-artifacts/checked_out_commit.txt

      # The smoke step writes this file only after the key scan passes.
      # A scan failure leaves the directory empty, and if-no-files-found
      # then fails the step without uploading.
      - name: Upload redacted failure manifest
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sceneagent-fruits-failure-manifest
          retention-days: 14
          if-no-files-found: error
          path: sf4-artifacts/manifest.json

  label_cleanup:
    name: label-cleanup
    needs: fruits_gpu_smoke
    if: >-
      always() &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'run-gpu-smoke' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Comment the run URL and remove run-gpu-smoke
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONCLUSION: ${{ needs.fruits_gpu_smoke.result }}
          GPU_SMOKE_ACTOR: ${{ github.actor }}
        run: |
          : "${GPU_SMOKE_ACTOR:?}"
          : "${CONCLUSION:?}"
          : "${REPO:?}"
          : "${PR_NUMBER:?}"
          : "${RUN_URL:?}"
          echo "gpu-smoke actor=${GPU_SMOKE_ACTOR} conclusion=${CONCLUSION}"
          if gh api --method DELETE "repos/${REPO}/issues/${PR_NUMBER}/labels/run-gpu-smoke"; then
            echo "removed label run-gpu-smoke"
          else
            echo "label run-gpu-smoke was already absent"
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "GPU smoke conclusion: ${CONCLUSION}. Run: ${RUN_URL}"
