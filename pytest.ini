[pytest]
# Put the repo root on sys.path so `pytest` works in a fresh clone without `pip install -e .`.
pythonpath =
    .
# Many tests need optional heavy deps (torch, open3d, faiss) that only exist in some of the
# conda envs. Without this, one missing dep aborts collection and runs zero tests. The exit
# code is still non-zero on a collection error, so genuine breakage is not masked.
addopts =
    --continue-on-collection-errors
    --strict-markers
testpaths =
    tests
norecursedirs =
    deps
    Data
    reports
markers =
    unit: unit tests
    integration: integration tests
    slow: slow tests that require the full model pipeline
    gpu: needs a GPU. The sceneagent CPU job runs `-m "not gpu"` and does not collect these. Mark the test instead of skipping it in that job.
    network: needs a network service. Registration only. The CPU job excludes it with `-m "not gpu and not network"`.
